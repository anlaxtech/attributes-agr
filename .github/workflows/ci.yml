name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Сервис и правила (тесты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  plugin:
    name: Плагин Revit ${{ matrix.revit }} (сборка)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Сборка (RevitAPI из NuGet — Revit на сборщике не нужен)
        run: dotnet build plugin/RevitAIClassifier/RevitAIClassifier.csproj -c Release -p:RevitVersion=${{ matrix.revit }} -p:UseRevitNuGet=true
      - uses: actions/upload-artifact@v4
        with:
          name: atributy-agr-plugin-R${{ matrix.revit }}
          path: plugin/RevitAIClassifier/bin/Release/R${{ matrix.revit }}/RevitAIClassifier.dll

  docker:
    name: Docker-образ сервиса (сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atributy-agr-service python
